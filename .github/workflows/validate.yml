name: validate
on:
  push:
  pull_request:

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Lint and build
        run: |
          az bicep lint --file main.bicep
          az bicep build --file main.bicep --stdout > /dev/null
      - name: Build parameter files
        run: |
          az bicep build-params --file dev.bicepparam --stdout > /dev/null
          az bicep build-params --file minimal.bicepparam --stdout > /dev/null
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Orchestration tests
        run: python -m unittest discover -s tests -v
      - name: PowerShell native-command contracts (offline)
        shell: pwsh
        run: ./tests/check-scripts.ps1
